id: https://neverblink.eu/linkml/tests/identifiedInteger/
name: identifiedInteger
description: A tree root with an integer identifier, which RDF preserves as a literal next to the node IRI.

imports:
  - linkml:types

classes:
  SomeClass:
    tree_root: true
    attributes:
      id:
        rank: 1
        identifier: true
        range: integer
      some_slot:
        rank: 2
        range: string
