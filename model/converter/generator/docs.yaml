id: https://linkml.ohi.dev/model/converter/generator/docs
name: docs-generator
prefixes:
  converter: https://linkml.ohi.dev/model/converter#
default_prefix: converter
imports:
  - ../shared

classes:
  DocsGeneratorOptions:
    description: Options of the Markdown documentation generator.
    mixins: [PruningOptions, MetadataLanguageOptions]
    slot_usage:
      pruning_mode:
        ifabsent: PruningMode(schema)
    attributes:
      single_file:
        examples:
          - value: true
        range: boolean
        required: true
        ifabsent: 'false'
        description: >-
          Whether to write all pages as sections of one document, `docs.md`, instead of one file
          for each page.
      only_file:
        range: string
        description: >-
          Write only the file with this path, such as `index.md` or `classes/person.md`, instead of
          all of them. Writing one page of a large schema is much faster than writing all of them.
          A path that is not one of the files gives no files.

functions:
  docs:
    description: >-
      Generate Markdown documentation. The files are `index.md` plus a page for each class, slot,
      enum, type and function, such as `classes/<name>.md`, or only `docs.md` with `single_file`.
      With `only_file`, only that one file.
    parameters: DocsGeneratorOptions
    returns: Files
